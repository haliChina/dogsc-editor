name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-test:
    name: Core tests (JVM, incl. real FFmpeg render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install FFmpeg (for the end-to-end render test)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - uses: gradle/actions/setup-gradle@v4
      - name: Core JVM tests
        run: ./gradlew :core:jvmTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/

  android-assemble:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dogsc-editor-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  desktop-compile:
    name: Desktop (Windows target) compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin --console=plain
